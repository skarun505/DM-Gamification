<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="ear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />

  <!-- Inner Soft Glow -->
  <circle cx="64" cy="64" r="50" fill="#6366F1" opacity="0.35" />

  <!-- Fox Ears -->
  <path d="M34 54 L44 20 L60 42 Z" fill="url(#ear)" stroke="#C2410C" stroke-width="2" />
  <path d="M39 50 L44 28 L54 42 Z" fill="#FED7AA" />
  
  <path d="M94 54 L84 20 L68 42 Z" fill="url(#ear)" stroke="#C2410C" stroke-width="2" />
  <path d="M89 50 L84 28 L74 42 Z" fill="#FED7AA" />

  <!-- Fox Head -->
  <circle cx="64" cy="70" r="40" fill="#F97316" stroke="#C2410C" stroke-width="2.5" />

  <!-- White Muzzle / Cheeks -->
  <path d="M36 78 C36 94 52 104 64 104 C76 104 92 94 92 78 C92 70 82 62 64 62 C46 62 36 70 36 78 Z" fill="#FFFFFF" />

  <!-- Headset / Goggles Strap -->
  <path d="M28 66 C28 44 44 32 64 32 C84 32 100 44 100 66" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
  <circle cx="28" cy="66" r="4.5" fill="#F59E0B" />
  <circle cx="100" cy="66" r="4.5" fill="#F59E0B" />

  <!-- Happy Curved Eyes -->
  <path d="M48 74 Q54 67 60 74" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M68 74 Q74 67 80 74" stroke="#1E1B4B" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Cute Nose -->
  <path d="M61 84 Q64 87 67 84 Q64 82 61 84 Z" fill="#1E1B4B" />

  <!-- Happy Smile -->
  <path d="M60 87 Q64 91 68 87" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Rosy Cheeks -->
  <circle cx="42" cy="80" r="4" fill="#FDA4AF" opacity="0.8" />
  <circle cx="86" cy="80" r="4" fill="#FDA4AF" opacity="0.8" />
</svg>
